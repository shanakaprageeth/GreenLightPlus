name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirnments.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirnments.txt
        pip install build pytest-cov
    
    - name: Install package in development mode
      run: |
        pip install -e .
      env:
        PYTHONPATH: ${{ github.workspace }}/src:$PYTHONPATH
    
    - name: Lint with basic checks
      run: |
        python -m py_compile src/greenlightadv_shanaka/**/*.py
        python -m py_compile tests/**/*.py
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=greenlightadv_shanaka --cov-report=xml
      env:
        PYTHONPATH: ${{ github.workspace }}/src:$PYTHONPATH
    
    - name: Test CLI functionality
      run: |
        # Test CLI help
        python -m greenlightadv_shanaka.cli --help
        
        # Test sample config creation
        python -m greenlightadv_shanaka.cli --create-config /tmp/test_config.json
        
        # Verify config file was created
        test -f /tmp/test_config.json
        
        # Test simulation with minimal config (disable plotting and MQTT)
        python -c "
import json
config = {
    'simulation': {'season_length': 0.5, 'season_interval': 0.125, 'first_day': 91},
    'mqtt': {'enable': false},
    'output': {'plot_results': false, 'log_level': 'WARNING'}
}
with open('/tmp/minimal_config.json', 'w') as f:
    json.dump(config, f)
        "
        python -m greenlightadv_shanaka.cli /tmp/minimal_config.json
      env:
        PYTHONPATH: ${{ github.workspace }}/src:$PYTHONPATH
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      if: matrix.python-version == '3.12'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: dist
        path: dist/
    
    - name: Install from wheel
      run: |
        pip install dist/*.whl
    
    - name: Test installed package
      run: |
        # Test CLI is available
        greenlight-sim --help
        greenlightadv --help
        
        # Test config creation
        greenlight-sim --create-config /tmp/integration_config.yaml
        test -f /tmp/integration_config.yaml
        
        # Run quick simulation test
        python -c "
import json
config = {
    'simulation': {'season_length': 0.25, 'season_interval': 0.25, 'first_day': 91},
    'mqtt': {'enable': false},
    'output': {'plot_results': false, 'log_level': 'ERROR'}
}
with open('/tmp/quick_test.json', 'w') as f:
    json.dump(config, f)
        "
        greenlight-sim /tmp/quick_test.json